<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萤火峡谷 · 塔防</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8f4ec; --mut:#8fb3a3; --gold:#ffc94d; --gold2:#ffdf8a; --teal:#4fe3b2;
  --red:#ff6d5a; --panel:#122b24; --line:#2b5a4a; --line2:#1a3d32;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:
    radial-gradient(1100px 700px at 75% -10%, #16382d, transparent 60%),
    radial-gradient(900px 700px at -10% 110%, #11362a, transparent 60%),
    linear-gradient(#0a1a15,#071310);
  color:var(--ink); font-family:'Noto Sans SC',system-ui,sans-serif;
  overflow-x:hidden; user-select:none;
}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 20px 44px}

/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:4px 2px 16px}
.brand h1{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:34px;letter-spacing:3px;color:var(--gold2);text-shadow:0 0 24px rgba(255,201,77,.35)}
.brand .tag{display:block;font-size:10px;letter-spacing:5px;color:var(--mut);margin-top:2px}
.stats{display:flex;gap:10px;margin-left:auto}
.stat{display:flex;align-items:center;gap:9px;background:linear-gradient(#16352c,#0f2620);
  border:1px solid var(--line2);border-radius:10px;padding:6px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.35)}
.stat .ico{width:18px;height:18px;flex:none}
.stat div{display:flex;flex-direction:column;line-height:1.05}
.stat b{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:20px}
.stat .lbl{font-size:9px;color:var(--mut);letter-spacing:3px}
#stGold b{color:var(--gold2)} #stLife b{color:#ff9d8a}
.stat.pop b{animation:pop .32s}
@keyframes pop{40%{transform:scale(1.35)}}
.stat.hurt{animation:hurt .4s}
@keyframes hurt{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ctrls{display:flex;gap:8px}
.cbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line2);
  background:linear-gradient(#16352c,#0f2620);color:var(--mut);font-size:13px;font-weight:700;
  cursor:pointer;transition:.15s}
.cbtn:hover{color:var(--gold2);border-color:var(--line);transform:translateY(-1px)}
.cbtn.off{color:#54726a;text-decoration:line-through}

/* ---------- 主区 ---------- */
main{display:flex;gap:18px;align-items:flex-start}
#stage{position:relative;flex:1;min-width:0}
#stage::before,#stage::after{content:'';position:absolute;width:26px;height:26px;pointer-events:none;z-index:2;opacity:.75}
#stage::before{top:-7px;left:-7px;border-top:2px solid var(--gold);border-left:2px solid var(--gold);border-radius:5px 0 0 0}
#stage::after{bottom:-7px;right:-7px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold);border-radius:0 0 5px 0}
#game{width:100%;display:block;background:#0c241c;border-radius:14px;border:1px solid #2f5f4e;
  box-shadow:0 0 0 4px #0c1f19,0 0 0 5px #2b5a4a,0 26px 60px rgba(0,0,0,.55)}
#game.placing{cursor:crosshair}
#stage.paused #game{filter:brightness(.72) saturate(.8)}
#pauseTag{position:absolute;top:12px;right:12px;display:none;z-index:3;background:rgba(10,25,20,.88);
  border:1px solid var(--line);color:var(--teal);padding:5px 12px;border-radius:8px;font-size:12px;letter-spacing:4px}
#stage.paused #pauseTag{display:block}
#banner{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:3;opacity:0;pointer-events:none;
  font-family:'ZCOOL KuaiLe';font-size:26px;letter-spacing:5px;color:#fff;white-space:nowrap;
  background:linear-gradient(90deg,transparent,rgba(8,22,17,.92) 16%,rgba(8,22,17,.92) 84%,transparent);
  padding:8px 40px;text-shadow:0 0 16px rgba(79,227,178,.5)}
#banner.show{animation:ban 2.3s ease forwards}
#banner.red{color:#ff9d8a;text-shadow:0 0 16px rgba(255,109,90,.6)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-16px) scale(.92)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,8px)}}
#hintbar{margin-top:12px;font-size:12px;color:var(--mut);letter-spacing:1px}
#hintbar b{color:var(--gold2);font-weight:700}

/* ---------- 结算 ---------- */
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
  background:rgba(4,12,9,.8);border-radius:14px}
#overlay.show{display:flex}
.ov-box{text-align:center;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#overlay h3{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:48px;letter-spacing:8px;margin-bottom:8px}
h3.win{color:var(--gold2);text-shadow:0 0 34px rgba(255,201,77,.55)}
h3.lose{color:#ff8d7a;text-shadow:0 0 34px rgba(255,109,90,.45)}
.ovsub{color:var(--mut);margin-bottom:20px;font-size:14px}
.ovstats{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.ovstats>div{background:#0f2620;border:1px solid var(--line2);border-radius:10px;padding:10px 20px;display:flex;flex-direction:column;gap:3px}
.ovstats b{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:24px;color:#fff}
.ovstats b i{font-style:normal;font-size:13px;color:var(--mut)}
.ovstats span{font-size:10px;color:var(--mut);letter-spacing:3px}
.btn{border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans SC';transition:.15s}
.btn.gold{background:linear-gradient(180deg,#ffd36b,#f0a92e);color:#3a2a05;font-family:'ZCOOL KuaiLe';
  font-size:17px;letter-spacing:4px;padding:12px 34px;box-shadow:0 4px 0 #8a6215,0 10px 24px rgba(240,169,46,.3)}
.btn.gold:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.gold:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6215}

/* ---------- 侧栏 ---------- */
aside{width:272px;flex:none;display:flex;flex-direction:column;gap:14px}
.panel{background:linear-gradient(180deg,#143129,#0e241d);border:1px solid var(--line2);border-radius:12px;
  padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35)}
.panel h2{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:16px;letter-spacing:3px;color:var(--teal);
  display:flex;align-items:center;gap:8px;margin-bottom:11px}
.panel h2::before{content:'';width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
#cards{display:flex;flex-direction:column;gap:8px}
.card{position:relative;display:flex;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line2);
  border-radius:10px;background:#0f2620;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:0 7px 16px rgba(0,0,0,.4)}
.card.sel{border-color:var(--gold);background:#1a3527;box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(255,201,77,.16)}
.card.dis{opacity:.5;filter:grayscale(.6)}
.cico{width:46px;height:46px;flex:none}
.cinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.cinfo b{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:15px;letter-spacing:2px;color:#eafff4}
.cinfo span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccost{margin-left:auto;display:flex;align-items:center;font-weight:700;color:var(--gold2);font-size:14px;flex:none}
.ccost i{width:9px;height:9px;border-radius:50%;margin-right:5px;
  background:radial-gradient(circle at 35% 30%,#ffe9a3,#f0a92e 60%,#8a6215)}
.ckey{position:absolute;top:4px;right:6px;font-style:normal;font-size:10px;color:var(--mut);
  border:1px solid var(--line2);border-radius:4px;padding:0 4px;line-height:14px}
.hint{margin-top:10px;font-size:11px;color:var(--mut);line-height:1.7}

#infoBody{min-height:120px}
.sel-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sel-head .dot{width:10px;height:10px;border-radius:50%;flex:none}
.sel-head b{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:16px;letter-spacing:2px}
.sel-head .lv{margin-left:auto;color:var(--gold2);font-size:12px;letter-spacing:2px}
.irow{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:1px dashed var(--line2);color:var(--mut)}
.irow b{color:#fff;font-weight:500}
.irow i{font-style:normal;color:var(--teal);font-size:11px;margin-left:4px}
.iacts{display:flex;gap:8px;margin-top:12px}
.btn.up{flex:1;background:linear-gradient(180deg,#5fe0b0,#2ea87c);color:#04241a;box-shadow:0 3px 0 #176b4d}
.btn.up:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn.up:disabled{background:#23443a;color:#5d8272;box-shadow:none;cursor:not-allowed}
.btn.sell{background:#3a2320;color:#ff9d8a;border:1px solid #6b332a}
.btn.sell:hover{background:#4b2a24}
.intel-t{font-size:12px;letter-spacing:2px;color:var(--gold2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0f2620;border:1px solid var(--line2);
  border-radius:20px;padding:3px 11px;font-size:12px}
.chip.boss{border-color:#7a3a2e;color:#ffb3a3}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tip{font-size:11px;color:var(--mut);line-height:1.8;border-top:1px dashed var(--line2);padding-top:8px}
.tip::before{content:'◆ ';color:var(--gold);font-size:9px}

#waveBtn{width:100%;padding:12px;border-radius:10px;border:1px solid #7a5a1d;cursor:pointer;
  background:linear-gradient(180deg,#ffd36b,#f0a92e);color:#3a2a05;
  font-family:'ZCOOL KuaiLe';font-size:17px;letter-spacing:3px;line-height:1.25;
  box-shadow:0 4px 0 #8a6215,0 8px 22px rgba(240,169,46,.25);transition:.15s}
#waveBtn small{display:block;font-family:'Noto Sans SC';font-size:11px;font-weight:700;letter-spacing:1px;color:#6b4a08}
#waveBtn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
#waveBtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8a6215}
#waveBtn:disabled{background:linear-gradient(180deg,#3a5348,#2a4038);color:#9dbfab;border-color:#22423a;
  box-shadow:0 4px 0 #1a3028;cursor:default}
#waveBar{height:5px;background:#0a1c16;border-radius:4px;margin-top:10px;overflow:hidden}
#waveBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fe3b2,#ffd75e);border-radius:4px}
#waveNote{margin-top:7px;font-size:11px;color:var(--mut);letter-spacing:1px}

@media (max-width:1020px){
  main{flex-direction:column}
  aside{width:100%;flex-direction:row;flex-wrap:wrap}
  .panel{flex:1;min-width:250px}
}
</style>
</head>
<body>
<canvas id="bgfx"></canvas>
<div id="app">
  <header>
    <div class="brand">
      <h1>萤火峡谷</h1>
      <span class="tag">FIREFLY CANYON · 守护祭坛的最后一夜</span>
    </div>
    <div class="stats">
      <div class="stat" id="stGold">
        <svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" fill="#ffc94d" stroke="#8a6215" stroke-width="1.5"/><circle cx="9" cy="9" r="4" fill="none" stroke="#b8860b" stroke-width="1.4"/></svg>
        <div><b id="vGold">230</b><span class="lbl">金币</span></div>
      </div>
      <div class="stat" id="stLife">
        <svg class="ico" viewBox="0 0 18 18"><path d="M9 15.5C4 11.5 1.5 8.6 1.5 5.8 1.5 3.6 3.2 2 5.3 2c1.5 0 2.9.8 3.7 2.1C9.8 2.8 11.2 2 12.7 2c2.1 0 3.8 1.6 3.8 3.8 0 2.8-2.5 5.7-7.5 9.7z" fill="#ff6d5a" stroke="#8a2a1d"/></svg>
        <div><b id="vLife">20</b><span class="lbl">生命</span></div>
      </div>
      <div class="stat" id="stWave">
        <svg class="ico" viewBox="0 0 18 18"><path d="M4 2v14" stroke="#8fb3a3" stroke-width="1.6" stroke-linecap="round"/><path d="M4 3h9l-2.5 3L13 9H4z" fill="#4fe3b2"/></svg>
        <div><b id="vWave">0/12</b><span class="lbl">波次</span></div>
      </div>
    </div>
    <div class="ctrls">
      <button class="cbtn" id="spdBtn" title="游戏速度">x1</button>
      <button class="cbtn" id="pauseBtn" title="暂停 (P)">❚❚</button>
      <button class="cbtn" id="sndBtn" title="音效开关">♫</button>
      <button class="cbtn" id="rstBtn" title="重新开始">⟳</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="game" width="800" height="500"></canvas>
      <div id="banner"></div>
      <div id="pauseTag">已暂停</div>
      <div id="overlay"><div class="ov-box" id="ovBox"></div></div>
      <div id="hintbar">左键 建造 / 选中 &nbsp;·&nbsp; 右键 取消 &nbsp;·&nbsp; <b>1-4</b> 快捷选塔 &nbsp;·&nbsp; <b>空格</b> 召唤下一波 &nbsp;·&nbsp; <b>P</b> 暂停</div>
    </div>

    <aside>
      <section class="panel">
        <h2>防御工坊</h2>
        <div id="cards"></div>
        <p class="hint">选中塔后点击草地放置,同类型可连续建造;点击已建塔可升级 / 出售(返还 70%)。</p>
      </section>
      <section class="panel">
        <h2>情报台</h2>
        <div id="infoBody"></div>
      </section>
      <section class="panel">
        <h2>作战指令</h2>
        <button id="waveBtn"></button>
        <div id="waveBar"><i></i></div>
        <div id="waveNote">击退敌军获得金币,波次清空有额外奖励</div>
      </section>
    </aside>
  </main>
</div>

<script>
'use strict';
/* ================= 基础 ================= */
const CELL=50, COLS=16, ROWS=10, W=COLS*CELL, H=ROWS*CELL;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lerpAng(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*Math.min(1,t);}

const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let dpr=1;
function fit(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
fit(); addEventListener('resize',fit);

/* ================= 路径 ================= */
const WP=[[-1,2],[3,2],[3,7],[7,7],[7,2],[11,2],[11,8],[14,8],[14,4],[16.5,4]];
const pts=WP.map(([c,r])=>({x:(c+.5)*CELL,y:(r+.5)*CELL}));
const segs=[]; let totalLen=0;
for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
  segs.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y,len,cum:totalLen,a:Math.atan2(b.y-a.y,b.x-a.x)});totalLen+=len;}
function posAt(d){d=clamp(d,0,totalLen-.001);let s=segs[0];
  for(const sg of segs){if(d>=sg.cum&&d<=sg.cum+sg.len){s=sg;break}}
  const k=(d-s.cum)/s.len;return{x:s.x1+(s.x2-s.x1)*k,y:s.y1+(s.y2-s.y1)*k,a:s.a};}
const pathCells=new Set();
for(let i=0;i<WP.length-1;i++){let[c1,r1]=WP[i],[c2,r2]=WP[i+1];
  c1=clamp(c1,0,COLS-1);c2=clamp(c2,0,COLS-1);r1=clamp(r1,0,ROWS-1);r2=clamp(r2,0,ROWS-1);
  if(r1===r2){for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)pathCells.add(c+','+r1);}
  else{for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)pathCells.add(c1+','+r);}}
const DECOS=[{c:0,r:0,type:'tree',seed:1},{c:15,r:0,type:'tree',seed:4},{c:9,r:5,type:'rock',seed:2},{c:1,r:9,type:'shroom',seed:0},{c:13,r:1,type:'shroom',seed:3}];
const decoCells=new Set(DECOS.map(d=>d.c+','+d.r));

/* ================= 数据 ================= */
const TOWERS={
  arrow :{name:'箭塔',  desc:'连射飞箭,单体输出',    cost:50, dmg:9, rate:2.6, range:115,proj:'arrow', color:'#7fd4c1'},
  cannon:{name:'火炮',  desc:'范围轰炸,克制成群',    cost:120,dmg:30,rate:.75, range:125,proj:'cannon',splash:58,color:'#ffb454'},
  frost :{name:'冰霜塔',desc:'脉冲寒气,减速敌军',    cost:90, dmg:5, rate:.8,  range:105,proj:'pulse', slow:{f:.55,t:1.6},color:'#7cc4ff'},
  tesla :{name:'电磁塔',desc:'链式闪电,贯穿多敌',    cost:150,dmg:16,rate:1.15,range:110,proj:'tesla', chain:3,color:'#ffd75e'},
};
const ORDER=['arrow','cannon','frost','tesla'];
const ENEMIES={
  imp:   {name:'小妖',    hp:46, spd:56, reward:8,  dmg:1, r:11,color:'#8fd45f'},
  wolf:  {name:'疾风狼',  hp:34, spd:105,reward:10, dmg:1, r:10,color:'#b9c4cf'},
  ogre:  {name:'石甲兽',  hp:190,spd:33, reward:24, dmg:2, r:15,color:'#c99a5b'},
  shaman:{name:'暗萨满',  hp:85, spd:46, reward:20, dmg:1, r:11,color:'#c779d6',heal:7},
  boss:  {name:'峡谷巨像',hp:1500,spd:24,reward:160,dmg:8, r:22,color:'#9aa7b5',boss:true},
  golem: {name:'远古巨像',hp:3400,spd:21,reward:320,dmg:12,r:26,color:'#8d99a8',boss:true},
};
const WAVES=[
  [{t:'imp',count:8,gap:.9}],
  [{t:'imp',count:8,gap:.8},{t:'wolf',count:3,gap:.7,delay:1}],
  [{t:'wolf',count:6,gap:.65},{t:'imp',count:8,gap:.7,delay:2}],
  [{t:'ogre',count:3,gap:1.6},{t:'imp',count:10,gap:.55,delay:1}],
  [{t:'wolf',count:10,gap:.5},{t:'shaman',count:2,gap:2,delay:2}],
  [{t:'boss',count:1,gap:1},{t:'imp',count:8,gap:.8,delay:3},{t:'ogre',count:2,gap:2,delay:4}],
  [{t:'ogre',count:5,gap:1.4},{t:'shaman',count:3,gap:1.8,delay:2},{t:'wolf',count:6,gap:.5,delay:3}],
  [{t:'imp',count:22,gap:.35},{t:'wolf',count:8,gap:.55,delay:2}],
  [{t:'ogre',count:8,gap:1.1},{t:'shaman',count:4,gap:1.6,delay:1}],
  [{t:'wolf',count:14,gap:.45},{t:'ogre',count:6,gap:1.2,delay:2},{t:'shaman',count:3,gap:2,delay:3}],
  [{t:'imp',count:14,gap:.4},{t:'ogre',count:8,gap:1,delay:1},{t:'shaman',count:4,gap:1.5,delay:2},{t:'wolf',count:10,gap:.4,delay:2}],
  [{t:'golem',count:2,gap:6},{t:'ogre',count:8,gap:1.1,delay:2},{t:'shaman',count:4,gap:1.6,delay:3},{t:'imp',count:12,gap:.45,delay:4}],
];
const HINTS=[
  '冰霜塔的减速配合火炮范围轰炸,伤害成吨。',
  '电磁塔的链式闪电对密集敌群效果拔群。',
  '石甲兽皮糙肉厚,把火力集中在路口。',
  '暗萨满会治疗周围敌人,优先点掉!',
  '提前召唤下一波可获得额外金币。',

let AC=null,master=null,nbuf=null;
function audio(){try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f0,f1,dur,type,vol){if(!AC||muted)return;try{
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);}catch(e){}}
function boomN(dur,vol,fc){if(!AC||muted)return;try{
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=nbuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
  const g=AC.createGain();const t0=AC.currentTime;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur);}catch(e){}}

let bgCan=null;
function makeBG(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#123128');gr.addColorStop(1,'#0c241c');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const rg=g.createRadialGradient(W*.7,-60,40,W*.7,-60,520);
  rg.addColorStop(0,'rgba(130,210,170,.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  for(let i=0;i<430;i++){g.fillStyle=['rgba(20,53,40,.6)','rgba(9,30,22,.6)','rgba(28,66,49,.5)'][i%3];
    g.beginPath();g.arc(rnd(0,W),rnd(0,H),rnd(.8,2.6),0,7);g.fill();}
  g.strokeStyle='rgba(46,110,80,.5)';g.lineWidth=1;
  for(let i=0;i<150;i++){const x=rnd(0,W),y=rnd(0,H);
    for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+k*2,y-4,x+k*3,y-rnd(5,8));g.stroke();}}
  for(let i=0;i<28;i++){g.fillStyle=i%4?'rgba(150,220,180,.5)':'rgba(255,210,120,.6)';
    g.beginPath();g.arc(rnd(0,W),rnd(0,H),1.4,0,7);g.fill();}
  // 道路
  const P=new Path2D();P.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)P.lineTo(pts[i].x,pts[i].y);
  g.lineJoin='round';g.lineCap='round';
  g.strokeStyle='#37322a';g.lineWidth=46;g.stroke(P);
  g.strokeStyle='#57503f';g.lineWidth=40;g.stroke(P);
  g.save();g.setLineDash([3,24]);g.lineDashOffset=rnd(0,20);
  g.strokeStyle='rgba(40,36,28,.55)';g.lineWidth=40;g.stroke(P);g.restore();
  g.strokeStyle='rgba(122,113,92,.35)';g.lineWidth=16;g.stroke(P);
  for(let d=0;d<totalLen;d+=rnd(18,34)){const p=posAt(d),off=rnd(20,26)*(Math.random()<.5?-1:1);
    const px=p.x-Math.sin(p.a)*off,py=p.y+Math.cos(p.a)*off;
    g.fillStyle='rgba(90,84,68,.8)';g.beginPath();g.arc(px,py,rnd(1.5,3),0,7);g.fill();}
  // 格点
  g.fillStyle='rgba(140,200,170,.10)';
  for(let cc=0;cc<=COLS;cc++)for(let rr2=0;rr2<=ROWS;rr2++){g.beginPath();g.arc(cc*CELL,rr2*CELL,1.1,0,7);g.fill();}
  // 暗角
  const vg=g.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,H*.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(4,10,8,.55)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  return c;
}

function drawTowerSprite(g,d,level,ang,recoil,x,y,s,seed){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,6,16,9,0,0,7);g.fill();
  rr(g,-16,-16,32,32,7);g.fillStyle='#2b443a';g.fill();g.lineWidth=2;g.strokeStyle='#16281f';g.stroke();
  g.beginPath();g.arc(0,0,12.5,0,7);g.fillStyle='#20362d';g.fill();
  g.globalAlpha=.85;g.strokeStyle=d.color;g.lineWidth=1.5;g.beginPath();g.arc(0,0,13.5,0,7);g.stroke();g.globalAlpha=1;
  g.save();
  if(d.proj==='pulse'){
    const pu=1+Math.sin(tGlobal*3+(seed||0))*0.07;g.scale(pu,pu);
    g.shadowColor='#7cc4ff';g.shadowBlur=10;
    g.beginPath();g.moveTo(0,-11);g.lineTo(8,0);g.lineTo(0,11);g.lineTo(-8,0);g.closePath();
    g.fillStyle='#bfe3ff';g.fill();g.shadowBlur=0;g.strokeStyle='#7cc4ff';g.lineWidth=1.5;g.stroke();
    g.beginPath();g.moveTo(0,-5);g.lineTo(4,0);g.lineTo(0,5);g.lineTo(-4,0);g.closePath();
    g.fillStyle='rgba(255,255,255,.85)';g.fill();
  }else if(d.proj==='tesla'){
    g.beginPath();g.arc(0,0,8,0,7);g.fillStyle='#3a3320';g.fill();g.strokeStyle='#8a7434';g.lineWidth=1.5;g.stroke();
    g.beginPath();g.arc(0,0,5,0,7);g.strokeStyle='#c8a24a';g.stroke();
    g.shadowColor='#ffd75e';g.shadowBlur=12;
    g.beginPath();g.arc(0,-2,4.5,0,7);g.fillStyle='#ffe9a3';g.fill();g.shadowBlur=0;
    if(Math.random()<.08){g.strokeStyle='#fff3c9';g.lineWidth=1;g.beginPath();
      const a=rnd(0,6.28);g.moveTo(Math.cos(a)*5,-2+Math.sin(a)*5);g.lineTo(Math.cos(a)*11,-2+Math.sin(a)*11);g.stroke();}
  }else{
    g.rotate(ang);
    if(d.proj==='arrow'){
      g.fillStyle='#cfe8dd';g.strokeStyle='#24443a';g.lineWidth=1.5;
      rr(g,2-recoil*5,-2.5,16,5,2);g.fill();g.stroke();
      g.beginPath();g.moveTo(18-recoil*5,0);g.lineTo(13-recoil*5,-4);g.lineTo(13-recoil*5,4);g.closePath();
      g.fillStyle='#7fd4c1';g.fill();
      g.beginPath();g.arc(0,0,7,0,7);g.fillStyle='#3b6f5f';g.fill();g.strokeStyle='#1c3a30';g.stroke();
      g.beginPath();g.arc(0,0,2.5,0,7);g.fillStyle='#7fd4c1';g.fill();
    }else{
      g.fillStyle='#22262b';g.strokeStyle='#0c0e11';g.lineWidth=1.5;
      rr(g,-recoil*6,-4.5,17,9,3);g.fill();g.stroke();
      g.fillStyle='#ffb454';g.fillRect(11-recoil*6,-4.5,3,9);
      g.beginPath();g.arc(0,0,8.5,0,7);g.fillStyle='#3a3f46';g.fill();g.strokeStyle='#181b20';g.stroke();
      g.beginPath();g.arc(0,0,3,0,7);g.fillStyle='#ffb454';g.fill();
    }
  }
  g.restore();
  for(let i=0;i<level;i++){g.beginPath();g.arc(-8+i*8,11,2.2,0,7);g.fillStyle='#ffc94d';g.fill();
    g.strokeStyle='#5c4308';g.lineWidth=1;g.stroke();}
  g.restore();
}

function drawEnemy(g,e){

  g.save();g.translate(e.x,e.y+bob);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,r*.8-bob,r*.9,r*.32,0,0,7);g.fill();
  if(e.key==='shaman'){g.globalAlpha=.12;g.beginPath();g.arc(0,0,75,0,7);g.fillStyle='#c779d6';g.fill();g.globalAlpha=1;}
  g.rotate(e.a);

    g.fillStyle='#5a9440';
    g.beginPath();g.moveTo(-r*.5,-r*.5);g.lineTo(-r*1.05,-r*.95);g.lineTo(-r*.2,-r*.8);g.closePath();g.fill();
    g.beginPath();g.moveTo(-r*.5,r*.5);g.lineTo(-r*1.05,r*.95);g.lineTo(-r*.2,r*.8);g.closePath();g.fill();
    g.beginPath();g.arc(0,0,r,0,7);g.fillStyle='#8fd45f';g.fill();g.lineWidth=2;g.strokeStyle='#41702c';g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(r*.35,-r*.32,2.6,0,7);g.arc(r*.35,r*.32,2.6,0,7);g.fill();
    g.fillStyle='#1c2a14';g.beginPath();g.arc(r*.45,-r*.32,1.2,0,7);g.arc(r*.45,r*.32,1.2,0,7);g.fill();
  }else if(e.key==='wolf'){
    g.strokeStyle='#8d99a6';g.lineWidth=3;g.beginPath();g.moveTo(-r*1.2,0);g.quadraticCurveTo(-r*1.8,-r*.4,-r*1.6,-r*.8);g.stroke();
    g.beginPath();g.ellipse(0,0,r*1.45,r*.8,0,0,7);g.fillStyle='#b9c4cf';g.fill();g.lineWidth=2;g.strokeStyle='#5c6a78';g.stroke();
    g.fillStyle='#b9c4cf';g.strokeStyle='#5c6a78';
    g.beginPath();g.moveTo(r*.7,-r*.4);g.lineTo(r*.95,-r*1.05);g.lineTo(r*1.15,-r*.4);g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(r*.7,r*.4);g.lineTo(r*.95,r*1.05);g.lineTo(r*1.15,r*.4);g.closePath();g.fill();g.stroke();
    g.beginPath();g.arc(r*.95,0,r*.6,0,7);g.fill();g.stroke();
    g.fillStyle='#ff6d5a';g.beginPath();g.arc(r*1.1,-r*.15,1.6,0,7);g.fill();
    g.fillStyle='#3a4450';g.beginPath();g.arc(r*1.5,0,1.8,0,7);g.fill();
  }else if(e.key==='ogre'){
    g.fillStyle='#e8dcc0';
    g.beginPath();g.moveTo(-r*.7,-r*.8);g.lineTo(-r*1.15,-r*1.35);g.lineTo(-r*.35,-r*.9);g.closePath();g.fill();
    g.beginPath();g.moveTo(-r*.7,r*.8);g.lineTo(-r*1.15,r*1.35);g.lineTo(-r*.35,r*.9);g.closePath();g.fill();
    rr(g,-r,-r*.85,r*2,r*1.7,7);g.fillStyle='#c99a5b';g.fill();g.lineWidth=2.5;g.strokeStyle='#6f4c25';g.stroke();
    g.beginPath();g.ellipse(-r*.1,0,r*.7,r*.55,0,0,7);g.fillStyle='#dcb57c';g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(r*.45,-r*.3,2.6,0,7);g.arc(r*.45,r*.3,2.6,0,7);g.fill();
    g.fillStyle='#3a2a14';g.beginPath();g.arc(r*.55,-r*.3,1.3,0,7);g.arc(r*.55,r*.3,1.3,0,7);g.fill();
    g.strokeStyle='#6f4c25';g.lineWidth=2;g.beginPath();g.moveTo(r*.2,-r*.55);g.lineTo(r*.7,-r*.35);g.moveTo(r*.2,r*.55);g.lineTo(r*.7,r*.35);g.stroke();
  }else if(e.key==='shaman'){
    g.strokeStyle='#7a5a3a';g.lineWidth=2.5;g.beginPath();g.moveTo(r*.55,-r*.1);g.lineTo(r*.55,-r*1.4);g.stroke();
    const pu=.6+.4*Math.sin(tGlobal*5+e.seed);
    g.shadowColor='#e9b3ff';g.shadowBlur=8*pu;
    g.beginPath();g.arc(r*.55,-r*1.5,3,0,7);g.fillStyle='#e9b3ff';g.fill();g.shadowBlur=0;
    g.beginPath();g.arc(0,0,r,0,7);g.fillStyle='#c779d6';g.fill();g.lineWidth=2;g.strokeStyle='#5f2f70';g.stroke();
    g.beginPath();g.arc(0,0,r,Math.PI*.9,Math.PI*2.1);g.fillStyle='#8a48a0';g.fill();
    g.fillStyle='#ffe08a';g.beginPath();g.arc(r*.35,-r*.2,2,0,7);g.arc(r*.35,r*.25,2,0,7);g.fill();
  }else{ // boss / golem
    const pu=.6+.4*Math.sin(tGlobal*4+e.seed);

    g.strokeStyle='rgba(180,225,255,.6)';g.lineWidth=1.2;g.stroke();

    g.strokeStyle='rgba(0,0,0,.7)';g.lineWidth=3;g.strokeText(e.def.name,e.x,by-5);
    g.fillStyle='#ffd7a3';g.fillText(e.def.name,e.x,by-5);
  }
}

function drawTree(g,x,y,seed){
  const sway=Math.sin(tGlobal*.9+seed)*.05;
  g.fillStyle='#4a3826';rr(g,x-3,y-2,6,13,2);g.fill();
  g.save();g.translate(x,y-4);g.rotate(sway);
  const cs=['#173d2d','#1d4a37','#256047'];
  for(let i=0;i<3;i++){g.beginPath();g.arc(0,-8-i*8,13-i*2.5,0,7);g.fillStyle=cs[i];g.fill();}
  g.restore();
}
function drawRock(g,x,y){
  g.fillStyle='#4d5a54';g.strokeStyle='#2a3531';g.lineWidth=2;
  g.beginPath();g.ellipse(x-7,y+4,9,7,0,0,7);g.fill();g.stroke();
  g.beginPath();g.ellipse(x+7,y+5,8,6,0,0,7);g.fill();g.stroke();
  g.beginPath();g.ellipse(x,y-3,10,8,0,0,7);g.fill();g.stroke();
  g.fillStyle='rgba(47,107,79,.85)';g.beginPath();g.ellipse(x,y-7,6,3,0,0,7);g.fill();
}
function drawShroom(g,x,y,seed){
  const pu=.5+.5*Math.sin(tGlobal*2.6+seed);
  const off=[[-9,3,.7],[0,0,1],[9,4,.6]];
  for(const[ox,oy,k]of off){
    const sx=x+ox,sy=y+oy;
    g.fillStyle='#d8cfae';rr(g,sx-2*k,sy-4*k,4*k,8*k,2);g.fill();
    g.shadowColor='#3fd0a4';g.shadowBlur=10*pu;
    g.beginPath();g.arc(sx,sy-4*k,7*k,Math.PI,0);g.closePath();
    g.fillStyle='#3fd0a4';g.fill();g.shadowBlur=0;
    g.fillStyle='#bfffe8';g.beginPath();g.arc(sx-2.5*k,sy-6*k,1.2*k,0,7);g.arc(sx+2.5*k,sy-5.5*k,1*k,0,7);g.fill();
  }
}
function drawDeco(g,d){const x=(d.c+.5)*CELL,y=(d.r+.5)*CELL;
  if(d.type==='tree')drawTree(g,x,y,d.seed);
  else if(d.type==='rock')drawRock(g,x,y);
  else drawShroom(g,x,y,d.seed);}

function drawShrine(g){

  g.fillStyle='#35463e';g.strokeStyle='#1b2a24';g.lineWidth=2;
  g.beginPath();g.arc(x,y,19,0,7);g.fill();g.stroke();
  g.fillStyle='#22352d';g.beginPath();g.arc(x,y,13,0,7);g.fill();
  g.fillStyle='#4a5c53';g.fillRect(x-14,y-18,4,14);g.fillRect(x+10,y-18,4,14);
  g.fillRect(x-17,y-21,34,4);
  const oy=y-32+Math.sin(tGlobal*1.6)*3;
  const gl=g.createRadialGradient(x,oy,1,x,oy,17+pu*5);
  gl.addColorStop(0,'rgba(255,225,140,.55)');gl.addColorStop(1,'rgba(255,225,140,0)');
  g.fillStyle=gl;g.beginPath();g.arc(x,oy,17+pu*5,0,7);g.fill();
  g.shadowColor='#ffd75e';g.shadowBlur=12;
  g.beginPath();g.arc(x,oy,5,0,7);g.fillStyle='#fff3c9';g.fill();g.shadowBlur=0;
  if(shrineFlash>0){
    const rg2=g.createRadialGradient(x,y,2,x,y,36);
    rg2.addColorStop(0,`rgba(255,90,70,${shrineFlash*.55})`);rg2.addColorStop(1,'rgba(255,90,70,0)');
    g.fillStyle=rg2;g.beginPath();g.arc(x,y,36,0,7);g.fill();
  }
}

/* ================= 战斗逻辑 ================= */
function buildQueue(groups){const q=[];
  for(const gr of groups){const st=gr.delay||0;for(let i=0;i<gr.count;i++)q.push({t:gr.t,time:st+i*gr.gap});}
  q.sort((a,b)=>a.time-b.time);return q;}
function spawnEnemy(key){const d=ENEMIES[key];
  const mul=d.boss?1+(wave-1)*.05:1+(wave-1)*.13;
  const hp=Math.round(d.hp*mul);
  enemies.push({key,def:d,dist:0,hp,maxHp:hp,spd:d.spd,r:d.r,x:pts[0].x,y:pts[0].y,a:0,
    slowT:0,slowF:1,healT:0,seed:rnd(0,7),dead:false});
  if(d.boss){banner('⚠ '+d.name+' 逼近!','red');sfx.wave();shake=Math.max(shake,6);}}
function acquire(t,st){let best=null,bd=-1;
  for(const e of enemies){if(e.dead)continue;
    const dx=e.x-t.x,dy=e.y-t.y;
    if(dx*dx+dy*dy<=st.range*st.range&&e.dist>bd){bd=e.dist;best=e;}}
  return best;}
const P=(x,y,vx,vy,dur,c,r,gv)=>particles.push({x,y,vx,vy,t:0,dur,c,r,g:gv||0});
function muzzle(t){P(t.x+Math.cos(t.angle)*15,t.y+Math.sin(t.angle)*15,Math.cos(t.angle)*40,Math.sin(t.angle)*40,.15,'255,240,180',2.5);}
function hurt(e,dmg,showF){if(e.dead)return;e.hp-=dmg;
  if(showF)floaters.push({x:e.x+rnd(-6,6),y:e.y-e.r-4,txt:String(Math.round(dmg)),c:'#ffe9d2',t:0,dur:.55,size:11});
  if(e.hp<=0){e.dead=true;onKill(e);}}
function onKill(e){gold+=e.def.reward;kills++;
  floaters.push({x:e.x,y:e.y-e.r-8,txt:'+'+e.def.reward,c:'#ffd75e',t:0,dur:.9,size:13,big:true});
  for(let i=0;i<6;i++)P(e.x,e.y,rnd(-50,50),rnd(-90,-40),.7,'255,205,90',2,260);
  sfx.coin();
  if(e.def.boss){shake=Math.max(shake,9);rings.push({x:e.x,y:e.y,r0:8,r1:70,t:0,dur:.6,c:'255,190,110'});
    for(let i=0;i<24;i++)P(e.x,e.y,rnd(-120,120),rnd(-120,120),rnd(.5,1),'255,160,90',rnd(2,4),120);}
  syncUI();}
function leak(e){lives=Math.max(0,lives-e.def.dmg);shrineFlash=1;shake=Math.max(shake,5);
  floaters.push({x:760,y:195,txt:'-'+e.def.dmg,c:'#ff8d7a',t:0,dur:1,size:14,big:true});
  sfx.leak();syncUI();
  if(lives<=0)defeat();}
function boom(x,y,dmg,splash){
  rings.push({x,y,r0:6,r1:splash,t:0,dur:.4,c:'255,170,90'});
  for(let i=0;i<14;i++)P(x,y,rnd(-110,110),rnd(-110,110),rnd(.3,.6),i%3?'255,150,70':'255,220,140',rnd(1.5,3.5),60);
  for(let i=0;i<5;i++)P(x,y,rnd(-25,25),rnd(-45,-15),rnd(.6,1),'120,120,115',rnd(3,5),-30);
  shake=Math.max(shake,3.5);sfx.boom();
  for(const e of enemies){if(e.dead)continue;
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<=splash+e.r)hurt(e,dmg*(1-.45*Math.min(1,d/splash)),true);}}
function fire(t,st,tgt){const d=t.def;
  if(d.proj==='arrow'){
    projectiles.push({kind:'arrow',x:t.x+Math.cos(t.angle)*13,y:t.y+Math.sin(t.angle)*13,tgt,lx:tgt.x,ly:tgt.y,spd:500,dmg:st.dmg,a:t.angle});
    t.recoil=1;muzzle(t);sfx.shoot();
  }else if(d.proj==='cannon'){
    projectiles.push({kind:'cannon',x:t.x+Math.cos(t.angle)*12,y:t.y+Math.sin(t.angle)*12,tgt,lx:tgt.x,ly:tgt.y,spd:300,dmg:st.dmg,splash:st.splash,a:t.angle});
    t.recoil=1;muzzle(t);sfx.shoot();
  }else if(d.proj==='pulse'){
    rings.push({x:t.x,y:t.y,r0:14,r1:st.range,t:0,dur:.5,c:'140,200,255'});
    for(const e of enemies){if(e.dead)continue;
      const dx=e.x-t.x,dy=e.y-t.y;
      if(dx*dx+dy*dy<=st.range*st.range){hurt(e,st.dmg,false);e.slowT=st.slowT;e.slowF=st.slowF;
        for(let i=0;i<2;i++)P(e.x+rnd(-6,6),e.y+rnd(-6,6),rnd(-15,15),rnd(-30,-10),.5,'170,220,255',1.8);}}
    sfx.ice();
  }else if(d.proj==='tesla'){
    const list=[tgt];let lastE=tgt;
    while(list.length<st.chain){let best=null,bd=95*95;
      for(const o of enemies){if(o.dead||list.includes(o))continue;
        const dx=o.x-lastE.x,dy=o.y-lastE.y,q=dx*dx+dy*dy;
        if(q<bd){bd=q;best=o;}}
      if(!best)break;list.push(best);lastE=best;}
    beams.push({pts:[{x:t.x,y:t.y-12},...list.map(e=>({x:e.x,y:e.y}))],t:0,dur:.16});
    list.forEach((e,i)=>{hurt(e,st.dmg*Math.pow(.85,i),true);
      for(let k=0;k<3;k++)P(e.x+rnd(-5,5),e.y+rnd(-5,5),rnd(-40,40),rnd(-40,40),.3,'255,235,150',1.6);});
    sfx.zap();
  }
}

/* ================= 波次流程 ================= */
function startWave(){audio();if(state!=='idle'&&state!=='count')return;
  if(state==='count'){const b=Math.ceil(countT*2.5);
    if(b>0){gold+=b;floaters.push({x:W/2,y:70,txt:'提前召唤 +'+b+'金',c:'#ffd75e',t:0,dur:1.1,size:14,big:true});}}
  wave++;queue=buildQueue(WAVES[wave-1]);waveClock=0;state='wave';
  const hasBoss=WAVES[wave-1].some(g=>ENEMIES[g.t].boss);
  banner(wave===WAVES.length&&hasBoss?'⚠ 最终波 · 远古巨像苏醒!':hasBoss?'⚠ 第 '+wave+' 波 · 巨像逼近!':'第 '+wave+' 波 · 来袭!',hasBoss?'red':'');
  sfx.wave();syncUI();renderInfo();}
function waveCleared(){const bonus=35+wave*7;gold+=bonus;
  if(wave>=WAVES.length){state='won';sfx.win();showOverlay(true);}
  else{state='count';countT=13;banner('第 '+wave+' 波 · 肃清! +'+bonus+'金');sfx.clear();}
  syncUI();renderInfo();}
function defeat(){if(state==='lost')return;state='lost';sfx.lose();shake=12;showOverlay(false);syncUI();}

/* ================= 更新 ================= */
function update(dt,raw){
  shake*=Math.exp(-raw*5);if(shake<.15)shake=0;
  shrineFlash=Math.max(0,shrineFlash-raw*1.4);
  // 环境:蘑菇孢子
  for(const d of DECOS){if(d.type!=='shroom')continue;
    d.st=(d.st===undefined?rnd(0,2):d.st)-raw;
    if(d.st<=0){d.st=rnd(1.6,3.2);
      P((d.c+.5)*CELL+rnd(-8,8),(d.r+.5)*CELL-6,rnd(-4,4),rnd(-16,-9),rnd(1.5,2.5),'120,240,190',rnd(1,2),-2);}}
  // 画布萤火
  for(const f of flies){f.x+=f.vx*raw;f.y+=f.vy*raw;
    f.vx=clamp(f.vx+rnd(-1,1)*raw*14,-10,10);f.vy=clamp(f.vy+rnd(-1,1)*raw*14,-8,8);
    if(f.x<-8)f.x=W+8;if(f.x>W+8)f.x=-8;if(f.y<-8)f.y=H+8;if(f.y>H+8)f.y=-8;}
  // 粒子等装饰(真实时间)
  for(const p of particles){p.t+=raw;p.x+=p.vx*raw;p.y+=p.vy*raw;p.vy+=p.g*raw;}
  particles=particles.filter(p=>p.t<p.dur);
  for(const f of floaters){f.t+=raw;f.y-=26*raw;}
  floaters=floaters.filter(f=>f.t<f.dur);
  for(const b of beams)b.t+=raw; beams=beams.filter(b=>b.t<b.dur);
  for(const r of rings)r.t+=raw; rings=rings.filter(r=>r.t<r.dur);

  if(dt<=0)return;
  if(state==='count'){countT-=dt;if(countT<=0)startWave();}
  if(state==='wave'){
    waveClock+=dt;
    while(queue.length&&queue[0].time<=waveClock)spawnEnemy(queue.shift().t);
  }
  // 敌人
  for(const e of enemies){if(e.dead)continue;
    const sf=e.slowT>0?e.slowF:1;e.slowT-=dt;
    e.dist+=e.spd*sf*dt;
    if(e.dist>=totalLen-30){e.dead=true;leak(e);continue;}
    const p=posAt(e.dist);e.x=p.x;e.y=p.y;e.a=p.a;
    if(e.def.heal){e.healT-=dt;
      if(e.healT<=0){e.healT=.7;
        for(const o of enemies){if(o===e||o.dead)continue;
          const dx=o.x-e.x,dy=o.y-e.y;
          if(dx*dx+dy*dy<75*75&&o.hp<o.maxHp){o.hp=Math.min(o.maxHp,o.hp+e.def.heal);
            P(o.x+rnd(-4,4),o.y-o.r,rnd(-6,6),rnd(-24,-14),.6,'140,240,150',1.8);}}}}
    if(e.slowT>0&&Math.random()<dt*5)P(e.x+rnd(-6,6),e.y+rnd(-8,2),rnd(-8,8),rnd(-14,-4),.5,'190,230,255',1.4);
  }
  enemies=enemies.filter(e=>!e.dead);
  // 塔
  for(const t of towers){t.cool-=dt;t.recoil=Math.max(0,t.recoil-dt*5);
    const st=tStats(t),tgt=acquire(t,st);
    if(tgt)t.angle=lerpAng(t.angle,Math.atan2(tgt.y-t.y,tgt.x-t.x),dt*14);
    if(t.cool<=0&&tgt){fire(t,st,tgt);t.cool=1/st.rate;}}
  // 弹道
  for(const p of projectiles){
    if(p.tgt&&!p.tgt.dead){p.lx=p.tgt.x;p.ly=p.tgt.y;}
    const dx=p.lx-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy),step=p.spd*dt;
    p.a=Math.atan2(dy,dx);
    if(d<=step+6){p.dead=true;
      if(p.kind==='cannon')boom(p.lx,p.ly,p.dmg,p.splash);
      else{if(p.tgt&&!p.tgt.dead)hurt(p.tgt,p.dmg,false);
        P(p.lx,p.ly,rnd(-20,20),rnd(-20,20),.2,'200,255,225',1.8);sfx.hit();}
    }else{p.x+=dx/d*step;p.y+=dy/d*step;
      if(p.kind==='cannon'&&Math.random()<dt*28)P(p.x,p.y,rnd(-8,8),rnd(-8,8),.35,'255,170,90',1.6);}}
  projectiles=projectiles.filter(p=>!p.dead);
  if(state==='wave'&&queue.length===0&&enemies.length===0)waveCleared();
}

/* ================= 渲染 ================= */
const flies=Array.from({length:9},()=>({x:rnd(0,W),y:rnd(0,H),vx:rnd(-8,8),vy:rnd(-6,6),ph:rnd(0,6),r:rnd(1.5,2.6)}));
function drawRange(g,x,y,r,anim){
  g.beginPath();g.arc(x,y,r,0,7);
  g.fillStyle='rgba(79,227,178,.07)';g.fill();
  if(anim){g.setLineDash([6,6]);g.lineDashOffset=-tGlobal*24;}
  g.strokeStyle='rgba(79,227,178,.5)';g.lineWidth=1.5;g.stroke();g.setLineDash([]);}
function strokeJitter(g,b){g.beginPath();g.moveTo(b.pts[0].x,b.pts[0].y);
  for(let i=1;i<b.pts.length;i++){const p=b.pts[i],q=b.pts[i-1];
    g.lineTo((p.x+q.x)/2+rnd(-4,4),(p.y+q.y)/2+rnd(-4,4));g.lineTo(p.x,p.y);}g.stroke();}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(shake>0){sx=rnd(-shake,shake);sy=rnd(-shake,shake);}
  ctx.save();ctx.translate(sx,sy);
  ctx.drawImage(bgCan,0,0);
  drawPortal(ctx);drawShrine(ctx);
  for(const d of DECOS)drawDeco(ctx,d);
  if(placing){ctx.strokeStyle='rgba(110,190,160,.14)';ctx.lineWidth=1;
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)
      if(canPlace(c,r))ctx.strokeRect(c*CELL+3,r*CELL+3,CELL-6,CELL-6);}
  if(selected)drawRange(ctx,selected.x,selected.y,tStats(selected).range,true);
  for(const t of towers){
    if(t===selected){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;
      ctx.strokeRect(t.c*CELL+2,t.r*CELL+2,CELL-4,CELL-4);}
    drawTowerSprite(ctx,t.def,t.level,t.angle,t.recoil,t.x,t.y,1,t.seed);}
  const es=[...enemies].sort((a,b)=>a.y-b.y);
  for(const e of es)drawEnemy(ctx,e);
  for(const p of projectiles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    if(p.kind==='arrow'){ctx.strokeStyle='#e8fff2';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(4,0);ctx.stroke();
      ctx.fillStyle='#7fd4c1';ctx.beginPath();ctx.arc(4,0,2,0,7);ctx.fill();
    }else{ctx.beginPath();ctx.arc(0,0,4.5,0,7);ctx.fillStyle='#2b2f34';ctx.fill();
      ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='rgba(255,180,84,.8)';ctx.beginPath();ctx.arc(-1.5,-1.5,1.4,0,7);ctx.fill();}
    ctx.restore();}
  for(const b of beams){const a=1-b.t/b.dur;ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle='rgba(255,220,120,.35)';ctx.lineWidth=6;strokeJitter(ctx,b);
    ctx.strokeStyle='#fff8e0';ctx.lineWidth=2;strokeJitter(ctx,b);ctx.restore();}
  for(const r of rings){const k=r.t/r.dur;ctx.beginPath();
    ctx.arc(r.x,r.y,r.r0+(r.r1-r.r0)*k,0,7);
    ctx.strokeStyle='rgba('+r.c+','+(1-k)+')';ctx.lineWidth=2.5;ctx.stroke();}
  for(const p of particles){const a=Math.max(0,1-p.t/p.dur)*.9;
    ctx.fillStyle='rgba('+p.c+','+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  for(const f of flies){const a=.2+.3*(.5+.5*Math.sin(tGlobal*2+f.ph));
    const gl=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*4);
    gl.addColorStop(0,'rgba(255,225,140,'+a+')');gl.addColorStop(1,'rgba(255,225,140,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(f.x,f.y,f.r*4,0,7);ctx.fill();}
  ctx.textAlign='center';
  for(const f of floaters){const k=f.t/f.dur,a=k<.2?k/.2:1-(k-.2)/.8;
    ctx.globalAlpha=Math.max(0,a);
    ctx.font=(f.big?'700 14px':'600 11px')+" 'Noto Sans SC',sans-serif";
    ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  if(placing&&mouse.in){
    const c=mouse.c,r=mouse.r;
    if(c>=0&&c<COLS&&r>=0&&r<ROWS){
      const ok=canPlace(c,r)&&gold>=TOWERS[placing].cost;
      const cx=(c+.5)*CELL,cy=(r+.5)*CELL,d=TOWERS[placing];
      ctx.fillStyle=ok?'rgba(79,227,178,.22)':'rgba(255,109,90,.22)';
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
      ctx.beginPath();ctx.arc(cx,cy,d.range,0,7);
      ctx.fillStyle=ok?'rgba(79,227,178,.08)':'rgba(255,109,90,.08)';ctx.fill();
      ctx.strokeStyle=ok?'rgba(79,227,178,.55)':'rgba(255,109,90,.55)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalAlpha=.8;drawTowerSprite(ctx,d,1,-Math.PI/2,0,cx,cy,1,0);ctx.globalAlpha=1;}}
  ctx.restore();
}

function intelHTML(){

  const chips=Object.entries(comp).map(([k,n])=>{const d=ENEMIES[k];
    return '<span class="chip'+(d.boss?' boss':'')+'"><i style="background:'+d.color+';box-shadow:0 0 8px '+d.color+'"></i>'+d.name+' ×'+n+'</span>';}).join('');
  return '<div class="intel-t">'+(state==='wave'?'当前波次 · 敌军构成':'第 '+(idx+1)+' 波 · 侦察情报')+'</div>'
    +'<div class="chips">'+chips+'</div>'
    +'<p class="tip">'+HINTS[wave%HINTS.length]+'</p>';}
function statRows(st,nx,d){
  let h='<div class="irow"><span>伤害</span><b>'+st.dmg+(nx?' <i>→ '+nx.dmg+'</i>':'')+'</b></div>'
    +'<div class="irow"><span>射程</span><b>'+st.range+(nx?' <i>→ '+nx.range+'</i>':'')+'</b></div>'
    +'<div class="irow"><span>射速</span><b>'+st.rate+'/s'+(nx?' <i>→ '+nx.rate+'/s</i>':'')+'</b></div>';
  if(d.splash)h+='<div class="irow"><span>溅射半径</span><b>'+st.splash+'</b></div>';
  if(d.chain)h+='<div class="irow"><span>链击目标</span><b>'+st.chain+' 个</b></div>';
  if(d.slow)h+='<div class="irow"><span>减速</span><b>'+Math.round((1-st.slowF)*100)+'% · '+st.slowT.toFixed(1)+'s</b></div>';
  return h;}
function renderInfo(){
  if(selected){const t=selected,d=t.def,st=tStats(t);
    const nx=t.level<3?tStats({def:d,level:t.level+1}):null;
    infoBody.innerHTML='<div class="sel-head"><span class="dot" style="background:'+d.color+';box-shadow:0 0 8px '+d.color+'"></span><b>'+d.name+'</b>'
      +'<span class="lv">'+'★'.repeat(t.level)+'☆'.repeat(3-t.level)+'</span></div>'
      +statRows(st,nx,d)
      +'<div class="iacts"><button class="btn up" id="upBtn" data-act="up" '+(t.level>=3?'disabled':'')+'>'
      +(t.level>=3?'已满级':'升级 ⬆ '+upCost(t))+'</button>'
      +'<button class="btn sell" data-act="sell">出售 +'+Math.round(t.invested*.7)+'</button></div>';
    syncUI();
  }else if(placing){const d=TOWERS[placing],st=tStats({def:d,level:1});
    infoBody.innerHTML='<div class="sel-head"><span class="dot" style="background:'+d.color+';box-shadow:0 0 8px '+d.color+'"></span><b>'+d.name+' · 蓝图</b></div>'
      +statRows(st,null,d)
      +'<p class="tip">点击草地放置 · 右键或 Esc 取消</p>';
  }else infoBody.innerHTML=intelHTML();}
infoBody.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!selected)return;
  if(b.dataset.act==='up'){const c=upCost(selected);
    if(selected.level<3&&gold>=c){gold-=c;selected.level++;selected.invested+=c;
      sfx.up();rings.push({x:selected.x,y:selected.y,r0:6,r1:34,t:0,dur:.45,c:'255,215,120'});
      for(let i=0;i<8;i++)P(selected.x,selected.y,rnd(-40,40),rnd(-70,-20),.6,'255,215,120',2,120);
      syncUI();renderInfo();}}
  else if(b.dataset.act==='sell'){const ref=Math.round(selected.invested*.7);
    gold+=ref;occ.delete(selected.c+','+selected.r);
    towers=towers.filter(t=>t!==selected);
    floaters.push({x:selected.x,y:selected.y-14,txt:'+'+ref,c:'#ffd75e',t:0,dur:.9,size:13,big:true});
    sfx.sell();selected=null;syncUI();renderInfo();}});

/* ---- 建造卡片 ---- */
const cardsEl=$('cards');
ORDER.forEach((k,i)=>{const d=TOWERS[k];
  const div=document.createElement('div');div.className='card';div.dataset.k=k;
  div.innerHTML='<canvas class="cico" width="48" height="48"></canvas>'
    +'<div class="cinfo"><b>'+d.name+'</b><span>'+d.desc+'</span></div>'
    +'<div class="ccost"><i></i>'+d.cost+'</div><em class="ckey">'+(i+1)+'</em>';
  div.addEventListener('click',()=>{audio();
    placing=placing===k?null:k;selected=null;
    cv.classList.toggle('placing',!!placing);syncUI();renderInfo();});
  cardsEl.appendChild(div);});
function renderIcons(){document.querySelectorAll('.card').forEach(cd=>{
  const k=cd.dataset.k,g=cd.querySelector('canvas').getContext('2d');
  g.clearRect(0,0,48,48);drawTowerSprite(g,TOWERS[k],1,-Math.PI/2,0,24,27,.92,1);});}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(renderIcons);else renderIcons();

/* ---- 交互 ---- */
function tryPlace(c,r){const d=TOWERS[placing];
  if(!canPlace(c,r)){sfx.deny();return;}
  if(gold<d.cost){floaters.push({x:(c+.5)*CELL,y:(r+.5)*CELL,txt:'金币不足',c:'#ff8d7a',t:0,dur:.9,size:12});
    sfx.deny();return;}
  gold-=d.cost;
  const t={key:placing,def:d,c,r,x:(c+.5)*CELL,y:(r+.5)*CELL,level:1,cool:0,
    angle:-Math.PI/2,recoil:0,invested:d.cost,seed:rnd(0,7)};
  towers.push(t);occ.set(c+','+r,t);
  sfx.place();rings.push({x:t.x,y:t.y,r0:4,r1:30,t:0,dur:.4,c:'79,227,178'});
  for(let i=0;i<8;i++)P(t.x+rnd(-10,10),t.y+rnd(-6,10),rnd(-25,25),rnd(-40,-10),.5,'140,180,150',2,80);
  syncUI();}
cv.addEventListener('mousemove',e=>{const rc=cv.getBoundingClientRect();
  mouse.x=(e.clientX-rc.left)*W/rc.width;mouse.y=(e.clientY-rc.top)*H/rc.height;
  mouse.c=Math.floor(mouse.x/CELL);mouse.r=Math.floor(mouse.y/CELL);mouse.in=true;});
cv.addEventListener('mouseleave',()=>mouse.in=false);
cv.addEventListener('click',()=>{audio();
  if(state==='won'||state==='lost')return;
  if(placing){tryPlace(mouse.c,mouse.r);return;}
  const t=towers.find(t=>Math.abs(t.x-(mouse.c+.5)*CELL)<CELL*.6&&Math.abs(t.y-(mouse.r+.5)*CELL)<CELL*.6);
  selected=t||null;syncUI();renderInfo();});
cv.addEventListener('contextmenu',e=>{e.preventDefault();
  placing=null;selected=null;cv.classList.remove('placing');syncUI();renderInfo();});
waveBtn.addEventListener('click',()=>{if(state==='idle'||state==='count')startWave();});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;
  if(k>='1'&&k<='4'){const key=ORDER[+k-1];
    placing=placing===key?null:key;selected=null;
    cv.classList.toggle('placing',!!placing);syncUI();renderInfo();}
  else if(k==='Escape'){placing=null;selected=null;cv.classList.remove('placing');syncUI();renderInfo();}
  else if(k===' '){e.preventDefault();if(state==='idle'||state==='count')startWave();}
  else if(k==='p'||k==='P')togglePause();});
function togglePause(){if(state==='won'||state==='lost')return;
  paused=!paused;stage.classList.toggle('paused',paused);
  $('pauseBtn').textContent=paused?'▶':'❚❚';}
$('pauseBtn').addEventListener('click',togglePause);
$('spdBtn').addEventListener('click',()=>{speed=speed===1?2:speed===2?3:1;
  $('spdBtn').textContent='x'+speed;});
$('sndBtn').addEventListener('click',()=>{muted=!muted;
  $('sndBtn').classList.toggle('off',muted);});
$('rstBtn').addEventListener('click',resetGame);
function showOverlay(win){ov.classList.add('show');
  ovBox.innerHTML='<h3 class="'+(win?'win':'lose')+'">'+(win?'峡谷守住了!':'防线失守…')+'</h3>'
    +'<p class="ovsub">'+(win?'萤火祭坛的光芒,因你而长明。':'巨像踏碎了祭坛的宁静……再试一次吧。')+'</p>'
    +'<div class="ovstats"><div><b>'+kills+'</b><span>击杀敌人</span></div>'
    +'<div><b>'+wave+'<i>/'+WAVES.length+'</i></b><span>抵达波次</span></div>'
    +'<div><b>'+Math.max(0,lives)+'</b><span>剩余生命</span></div></div>'
    +'<button class="btn gold" id="againBtn">⟳ 再战一局</button>';
  $('againBtn').onclick=()=>{ov.classList.remove('show');resetGame();};}
function resetGame(){
  gold=230;lives=20;wave=0;kills=0;state='idle';countT=0;waveClock=0;queue=[];
  towers=[];enemies=[];projectiles=[];particles=[];floaters=[];beams=[];rings=[];
  occ.clear();selected=null;placing=null;cv.classList.remove('placing');
  paused=false;stage.classList.remove('paused');$('pauseBtn').textContent='❚❚';
  shrineFlash=0;shake=0;ov.classList.remove('show');
  for(const k in statCache)delete statCache[k];
  _lbl='';syncUI();renderInfo();banner('守住萤火祭坛!');}

/* ================= 主循环 ================= */
bgCan=makeBG();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);
  let raw=(now-last)/1000;last=now;if(raw>.05)raw=.05;
  tGlobal+=raw;
  const dt=(paused||state==='won'||state==='lost')?0:raw*speed;
  update(dt,raw);render();drawBG(raw);updateWaveUI();}
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
